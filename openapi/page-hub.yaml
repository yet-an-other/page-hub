openapi: 3.1.0
info:
  title: Page Hub manager browser API
  version: 1.0.0
paths:
  /_page-hub/api/v1/status:
    get:
      operationId: getManagerStatus
      responses:
        '200':
          description: Current manager and storage status.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ManagerStatus'
        '401':
          description: Trusted gateway assertion missing or invalid.
  /_page-hub/api/v1/inventory:
    get:
      operationId: getInventory
      responses:
        '200':
          description: Catalog-backed inventory of Projects and Publications with the latest bucket observation and refresh progress.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Inventory'
        '401':
          description: Trusted gateway assertion missing or invalid.
        '503':
          description: The catalog inventory is unavailable.
  /_page-hub/api/v1/refresh:
    post:
      operationId: requestRefresh
      description: Requests a storage observation. Joins an already running scan instead of queueing another one; answers when the joined scan completes.
      responses:
        '200':
          description: Current refresh state after the requested (or joined) scan.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RefreshState'
        '401':
          description: Trusted gateway assertion missing or invalid.
        '503':
          description: The observation service is unavailable.
  /_page-hub/healthz:
    get:
      operationId: getHealth
      responses:
        '200':
          description: Process is serving requests.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthStatus'
        '401':
          description: Trusted gateway assertion missing or invalid.
  /_page-hub/readyz:
    get:
      operationId: getReadiness
      responses:
        '200':
          description: Manager and bucket are reachable.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReadinessStatus'
        '401':
          description: Trusted gateway assertion missing or invalid.
        '503':
          description: Manager is serving but storage is unavailable or misconfigured.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReadinessStatus'
components:
  schemas:
    Inventory:
      type: object
      required: [projects, observation, refresh]
      properties:
        projects:
          type: array
          items:
            $ref: '#/components/schemas/InventoryProject'
        observation:
          description: Latest complete bucket observation, or null before the first successful scan.
          oneOf:
            - $ref: '#/components/schemas/BucketObservation'
            - type: "null"
        refresh:
          $ref: '#/components/schemas/RefreshState'
    RefreshState:
      type: object
      required: [running, lastOutcome]
      properties:
        running:
          type: boolean
          description: Whether a full storage scan is currently running.
        lastOutcome:
          type: string
          enum: [never, succeeded, unavailable, misconfigured, failed]
          description: Outcome of the most recent scan attempt; provider details are never included.
    InventoryProject:
      type: object
      required: [id, prefix, displayName, description, publications]
      properties:
        id:
          type: string
        prefix:
          type: string
        displayName:
          type: string
        description:
          type: string
        publications:
          type: array
          items:
            $ref: '#/components/schemas/InventoryPublication'
    InventoryPublication:
      type: object
      required: [id, path, displayName, description, entryPoint, routingMode, size, contentChangedAt, observation]
      properties:
        id:
          type: string
        path:
          type: string
        displayName:
          type: string
        description:
          type: string
        entryPoint:
          type: string
        routingMode:
          type: string
          enum: [exact_file, directory_index, fallback]
        size:
          type: integer
          description: Accepted size in bytes from the current manifest.
        contentChangedAt:
          type: string
          format: date-time
        observation:
          description: Observed storage state from the latest complete bucket observation.
          oneOf:
            - $ref: '#/components/schemas/PublicationObservation'
            - type: "null"
    PublicationObservation:
      type: object
      required: [state, observedSize, statusDetail]
      properties:
        state:
          type: string
          enum: [in_sync, drifted, missing]
        observedSize:
          description: Sum of observed sizes of the Publication's objects found in storage; null when none were found.
          oneOf:
            - type: integer
              format: int64
            - type: "null"
        statusDetail:
          type: string
          description: Bounded, deterministic summary of the differences from the accepted manifest.
    BucketObservation:
      type: object
      required: [observedAt, mutationLock, usage, stale]
      properties:
        observedAt:
          type: string
          format: date-time
        mutationLock:
          type: string
          enum: [none, global, publication]
          description: Storage-mutation lock this observation implies for later storage mutations.
        usage:
          $ref: '#/components/schemas/BucketUsage'
        stale:
          type: boolean
          description: True when the observation is older than five minutes.
    BucketUsage:
      type: object
      required: [quotaBytes, totalBytes, acceptedBytes, unclaimedBytes]
      properties:
        quotaBytes:
          type: integer
          format: int64
          description: Configured bucket quota in bytes.
        totalBytes:
          type: integer
          format: int64
          description: Exact usage of the complete bucket observation.
        acceptedBytes:
          type: integer
          format: int64
          description: Usage of the accepted Publication manifests.
        unclaimedBytes:
          type: integer
          format: int64
          description: Usage of unexpected objects outside every accepted manifest.
    StorageStatus:
      type: object
      required: [status]
      properties:
        status:
          type: string
          enum: [reachable, unavailable, misconfigured]
    ManagerStatus:
      type: object
      required: [version, storage]
      properties:
        version:
          type: string
        storage:
          $ref: '#/components/schemas/StorageStatus'
    HealthStatus:
      type: object
      required: [status, version]
      properties:
        status:
          type: string
          const: ok
        version:
          type: string
    ReadinessStatus:
      type: object
      required: [status, storage]
      properties:
        status:
          type: string
          enum: [ready, degraded]
        storage:
          type: string
          enum: [reachable, unavailable, misconfigured]
