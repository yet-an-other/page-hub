name: CI

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.12.2
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml
      - uses: actions/setup-go@v5
        with:
          go-version: '1.23.x'
      - run: pnpm --dir web install --frozen-lockfile
      - run: pnpm --dir web exec playwright install --with-deps chromium
      - run: make verify
      - run: make release VERSION="${GITHUB_REF_NAME:-ci-${GITHUB_SHA::12}}"
      - uses: actions/upload-artifact@v4
        with:
          name: page-hub-linux-amd64
          path: |
            dist/page-hub-*-linux-amd64
            dist/page-hub-*-linux-amd64.sha256

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: page-hub-linux-amd64
          path: dist
      - name: Publish versioned binary and checksum
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          gh release create "$TAG" --generate-notes \
            dist/page-hub-*-linux-amd64 \
            dist/page-hub-*-linux-amd64.sha256
